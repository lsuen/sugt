<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUGT 小su</title>
    <style>
      /* 期望：精灵透明窗入口零底色，因为半透明底板会在移动时拖出矩形重影；
         用 C27b 静态契约与逐帧目视验收。压缩器不得删掉 transparent。 */
      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        background-color: transparent !important;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay.tsx"></script>
  </body>
