<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SUGT - su gateway</title>
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        background: #070b14;
        color: #edf7ff;
      }
      /* 首屏骨架：窗口 show 后到 React 首次 paint 之间显示，避免纯黑空窗。
         React 挂载时会整体替换 #root 内容，不需要手动清理。 */
      .boot-splash {
        display: flex;
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      .boot-splash .boot-side {
        width: 220px;
        flex: 0 0 220px;
        border-right: 1px solid rgba(148, 169, 189, .12);
        padding: 22px 16px;
        box-sizing: border-box;
      }
      .boot-splash .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .boot-splash .boot-logo {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: linear-gradient(135deg, #16f1ff, #6d5cff);
        box-shadow: 0 0 24px rgba(22, 241, 255, .35);
      }
      .boot-splash .boot-brand-text {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .boot-splash .boot-nav {
        height: 14px;
        margin: 0 0 18px;
        border-radius: 6px;
        background: rgba(148, 169, 189, .10);
      }
      .boot-splash .boot-nav.active { background: linear-gradient(90deg, rgba(22,241,255,.35), rgba(22,241,255,.05)); }
      .boot-splash .boot-main { flex: 1; padding: 30px 34px; box-sizing: border-box; }
      .boot-splash .boot-title { width: 180px; height: 26px; border-radius: 8px; background: rgba(148,169,189,.16); margin-bottom: 10px; }
      .boot-splash .boot-sub { width: 300px; height: 13px; border-radius: 6px; background: rgba(148,169,189,.08); margin-bottom: 30px; }
      .boot-splash .boot-card { height: 150px; border-radius: 16px; background: rgba(148,169,189,.06); border: 1px solid rgba(148,169,189,.08); margin-bottom: 18px; }
      .boot-splash .boot-status {
        position: fixed;
        right: 26px;
        bottom: 22px;
        font-size: 12px;
        letter-spacing: .5px;
        color: #7f95a9;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .boot-splash .boot-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #16f1ff;
        box-shadow: 0 0 12px #16f1ff;
        animation: bootPulse 1.1s ease-in-out infinite;
      }
      @keyframes bootPulse { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-side">
          <div class="boot-brand">
            <div class="boot-logo"></div>
            <div class="boot-brand-text">
              <div class="boot-title" style="width:70px;height:16px;margin:0"></div>
              <div class="boot-nav" style="width:92px;height:9px;margin:0"></div>
            </div>
          </div>
          <div class="boot-nav active"></div>
          <div class="boot-nav" style="width:78%"></div>
          <div class="boot-nav" style="width:88%"></div>
          <div class="boot-nav" style="width:65%"></div>
          <div class="boot-nav" style="width:82%"></div>
        </div>
        <div class="boot-main">
          <div class="boot-title"></div>
          <div class="boot-sub"></div>
          <div class="boot-card"></div>
          <div class="boot-card" style="height:110px"></div>
        </div>
        <div class="boot-status"><span class="boot-dot"></span>正在启动 SUTAI…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
