# 作者：sun / 孙文龙
# 用途：推送 v* tag 自动构建 Windows / macOS 安装包并发布到 GitHub Release。
# 关键约定：release 资产名固定、不带版本号，这样
#   https://github.com/lsuen/sugt/releases/latest/download/<asset>
# 永远是有效链接，下载站、Homebrew cask 与应用内更新都不必随版本改动。
# tag 仍必须是语义化版本号（v1.1.8），因为应用内更新用 tag 做版本比较。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.1.8）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 稳定资产名：改这里必须同步 AGENTS.md、README、Homebrew cask 与 lsuenweb。
  ASSET_WIN_SETUP: SUTAI-windows-x64-setup.exe
  ASSET_WIN_ZIP: SUTAI-windows-x64.zip
  ASSET_MAC_ARM64: SUTAI-macos-arm64.zip
  ASSET_MAC_X64: SUTAI-macos-x64.zip
  ASSET_CHECKSUMS: SUTAI-checksums.txt

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer and CLI
        shell: pwsh
        run: |
          npx tauri build --bundles nsis
          cargo build --release --bin sugt-cli --manifest-path src-tauri/Cargo.toml

      - name: Package stable-name assets
        shell: pwsh
        run: |
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = "src-tauri/target/release/sugt.exe"
          $cli = "src-tauri/target/release/sugt-cli.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path $cli)) { throw "missing $cli" }

          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "missing NSIS installer" }
          Copy-Item $nsis.FullName (Join-Path $out $env:ASSET_WIN_SETUP)

          $stage = Join-Path $out "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "sugt.exe")
          Copy-Item $cli (Join-Path $stage "sugt-cli.exe")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $out $env:ASSET_WIN_ZIP) -Force
          Remove-Item $stage -Recurse -Force
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: SUTAI-macos-arm64.zip
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: SUTAI-macos-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build .app bundle
        run: npx tauri build --target ${{ matrix.target }} --bundles app

      - name: Package stable-name zip
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="$(find "$bundle" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "::error::在 $bundle 下未找到 .app"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "release-assets/${{ matrix.asset }}"
          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum $ASSET_WIN_SETUP $ASSET_WIN_ZIP $ASSET_MAC_ARM64 $ASSET_MAC_X64 > "$ASSET_CHECKSUMS"
          cat "$ASSET_CHECKSUMS"
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SUGT ${{ inputs.tag || github.ref_name }}
          body: |
            Release 资产名固定、不含版本号，以下链接始终指向最新版本：

            - Windows 安装包：`SUTAI-windows-x64-setup.exe`
            - Windows 便携包：`SUTAI-windows-x64.zip`
            - macOS Apple Silicon：`SUTAI-macos-arm64.zip`
            - macOS Intel：`SUTAI-macos-x64.zip`
            - 校验清单：`SUTAI-checksums.txt`

            也可直接用 `https://github.com/lsuen/sugt/releases/latest/download/<文件名>` 获取。
            macOS 应用未签名，首次启动请右键 → 打开，或执行 `xattr -cr "/Applications/SUTAI.app"`。
          files: |
            release-assets/SUTAI-windows-x64-setup.exe
            release-assets/SUTAI-windows-x64.zip
            release-assets/SUTAI-macos-arm64.zip
            release-assets/SUTAI-macos-x64.zip
            release-assets/SUTAI-checksums.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
