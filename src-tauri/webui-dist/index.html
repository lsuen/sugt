<h1>SUGT WebUI</h1>
<p>这是随源码保留的占位页，保证 <code>cargo build</code> 在无前端产物时也能通过。</p>
<p>生成真实前端：项目根目录执行 <code>npm ci &amp;&amp; npm run build:web</code>，会覆盖本文件并生成 assets。</p>
<p>CLI 发布流水线已自动执行该步骤，正式包内嵌入的是完整界面。</p>
