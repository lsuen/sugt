[package]
name = "sugt"
version = "1.1.1"
description = "SUGT - su gateway"
authors = ["孙文龙"]
edition = "2021"
rust-version = "1.78"
default-run = "sugt"

[lib]
name = "sugt_lib"

[[bin]]
name = "sugt"
path = "src/main.rs"

[[bin]]
name = "sugt-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
futures-util = "0.3"
http = "1.1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.9.1", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.3.1"
thiserror = "1.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation"] }

[dependencies.axum]
version = "0.7"
features = ["macros", "json"]
